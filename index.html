<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Student Profile Card Hello</h1>
    <div class="form-box">
        <input type="text" id="nameInput" placeholder="Enter name">
        <input type="number" id="ageInput" placeholder="Enter age">
        <input type="text" id="subjectInput" placeholder="Enter favorite subject">
        <button onclick="createProfile()">Create Profile</button>
    </div>

    <div class="card" id="profileCard">
        <h2 id="studentName">Name: -</h2>
        <p id="studentAge">Age: -</p>
        <p id="studentSubject">Favorite Subject: -</p>
    </div>



</div>

    <script src="script.js"></script>
</body>
</html>
